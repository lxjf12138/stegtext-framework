schema_version = 2
name = "token_budget_T1_k32"

[source]
models = ["qwen_instruct", "llama_instruct"]
profile = "stego"
prompt_mode = "chat"
kv_cache = "cpu_snapshots"
languages = { qwen_instruct = "zh", llama_instruct = "en" }
sampling_contract = "controlled_topk_T1_v1"

[source.sampling]
do_sample = true
temperature = 1.0
top_p = 1.0
top_k = 32
repetition_penalty = 1.0
min_p = 0.0
typical_p = 1.0

[inputs]
ordinary_seed_policy = "independent_conditions_v1"
seeds = [211, 223]
prompts = [
  {id="city_zh", language="zh", text="请用中文写一句自然、完整的句子，描述城市清晨的生活。"},
  {id="weather_zh", language="zh", text="请用中文写一句自然、完整的话，解释天气预报如何帮助人们安排出行。"},
  {id="city_en", language="en", text="Write one natural, complete sentence describing early morning life in a city."},
  {id="weather_en", language="en", text="Write one natural, complete sentence explaining how weather forecasts help people plan a journey."},
]

[message]
mode = "fixture"
bits = 131072
pattern = "random"
delivery = "prefix_stream"

[randomness]
mode = "fixture"

[stopping]
mode = "token_budget"
max_new_tokens = 256
watchdog_generated_tokens = 512
watchdog_protocol_decisions = 16384

[[variants]]
id = "ordinary"
kind = "ordinary"

[[variants]]
id = "syncpool_imec_terminal"
kind = "planner"
method = "syncpool"
coder = "imec_prefix_exact"
coder_parameters = {block_size=6, window_size=3, coupling_strategy="greedy", schedule="head_first"}

[[variants]]
id = "las_imec_terminal"
kind = "planner"
method = "las"
coder = "imec_prefix_exact"
coder_parameters = {block_size=6, window_size=3, coupling_strategy="greedy", schedule="head_first"}

[[variants]]
id = "syncpool_discop"
kind = "planner"
method = "syncpool"
coder = "discop_copy"

[[variants]]
id = "las_discop"
kind = "planner"
method = "las"
coder = "discop_copy"
