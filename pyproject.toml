[project]
name = "stegatext-workspace"
version = "0.1.0"
description = "Isolated, reproducible research environment for the frozen StegText package"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.8.0",
    "transformers==4.57.6",
    "accelerate==1.12.0",
    "numpy==1.26.4",
    "pandas==2.3.3",
    "pyarrow==22.0.0",
    "huggingface-hub==0.36.0",
    "safetensors==0.7.0",
    "sentencepiece==0.2.1",
    "pytest==8.4.2",
    "pypdf==6.4.2",
    "scipy==1.15.3",
    "cython==3.0.12",
    "bitarray==3.7.2",
    "pillow==11.3.0",
    "pysbd==0.3.4",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pypi-tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[tool.pytest.ini_options]
testpaths = ["tests"]
